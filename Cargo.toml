[package]
name = "barge"
version = "0.1.0"
edition = "2021"
description = "Move Steam games between libraries, safely and at your own pace"
license = "GPL-3.0"
repository = "https://github.com/sbstn-0x2a/barge"
rust-version = "1.75"

# Stufe 1/2 sind bewusst dependency-frei (nur std + libc-Syscalls via
# `extern "C"`). Ab Stufe 3 kommt für das Transaktionsjournal JSON dazu —
# serde/serde_json sind im Handout §9 ohnehin vorgesehen. Zeitstempel (Epoch)
# und Job-IDs (/dev/urandom) bleiben dependency-frei.
# Die GUI-Crates (§9: eframe, egui_extras, rfd, ...) kommen erst mit Stufe 5.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = "0.29"      # GUI (§8), immediate mode; X11 + Wayland via winit/glow
egui_extras = { version = "0.29", features = ["all_loaders"] } # Tabellen + Bild-Loader (§8.1, §3.5)
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] } # Cover decodieren
rfd = "0.15"         # nativer Ordnerdialog (§8.3)
ureq = "2"           # Cover vom Steam-CDN laden und lokal cachen (§3.5)

[profile.release]
opt-level = 2
