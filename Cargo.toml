[package]
name = "barge"
version = "0.1.0"
edition = "2021"
description = "Move Steam games between libraries, safely and at your own pace"
license = "GPL-3.0"
repository = "https://github.com/sbstn-0x2a/barge"
rust-version = "1.75"

# Stufe 1/2 sind bewusst dependency-frei (nur std + libc-Syscalls via
# `extern "C"`). Ab Stufe 3 kommt für das Transaktionsjournal JSON dazu —
# serde/serde_json sind im Handout §9 ohnehin vorgesehen. Zeitstempel (Epoch)
# und Job-IDs (/dev/urandom) bleiben dependency-frei.
# Die GUI-Crates (§9: eframe, egui_extras, rfd, ...) kommen erst mit Stufe 5.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = "0.29"      # GUI (§8), immediate mode; X11 + Wayland via winit/glow
egui_extras = { version = "0.29", features = ["all_loaders"] } # Tabellen + Bild-Loader (§8.1, §3.5)
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] } # Cover decodieren
rfd = "0.15"         # nativer Ordnerdialog (§8.3)
ureq = "2"           # Cover vom Steam-CDN laden und lokal cachen (§3.5)

[profile.release]
opt-level = 2

# ---------------------------------------------------------------- Packaging
# .deb via `cargo deb`, .rpm via `cargo generate-rpm` (in der CI installiert).

[package.metadata.deb]
maintainer = "sbstn-0x2a"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
extended-description = "GUI-Tool zum sicheren, gedrosselten Verschieben von Steam-Spielen zwischen Libraries unter Linux — bildet bewusst ein niedriges I/O-Lastprofil nach, um Freezes bei externen NVMe-Gehäusen (USB4) zu vermeiden."
assets = [
    ["target/release/barge", "usr/bin/", "755"],
    ["assets/io.schnetter.Barge.desktop", "usr/share/applications/", "644"],
    ["assets/io.schnetter.Barge.svg", "usr/share/icons/hicolor/scalable/apps/io.schnetter.Barge.svg", "644"],
    ["assets/icons/hicolor/16x16/apps/io.schnetter.Barge.png", "usr/share/icons/hicolor/16x16/apps/io.schnetter.Barge.png", "644"],
    ["assets/icons/hicolor/32x32/apps/io.schnetter.Barge.png", "usr/share/icons/hicolor/32x32/apps/io.schnetter.Barge.png", "644"],
    ["assets/icons/hicolor/48x48/apps/io.schnetter.Barge.png", "usr/share/icons/hicolor/48x48/apps/io.schnetter.Barge.png", "644"],
    ["assets/icons/hicolor/64x64/apps/io.schnetter.Barge.png", "usr/share/icons/hicolor/64x64/apps/io.schnetter.Barge.png", "644"],
    ["assets/icons/hicolor/128x128/apps/io.schnetter.Barge.png", "usr/share/icons/hicolor/128x128/apps/io.schnetter.Barge.png", "644"],
    ["assets/icons/hicolor/256x256/apps/io.schnetter.Barge.png", "usr/share/icons/hicolor/256x256/apps/io.schnetter.Barge.png", "644"],
    ["assets/icons/hicolor/512x512/apps/io.schnetter.Barge.png", "usr/share/icons/hicolor/512x512/apps/io.schnetter.Barge.png", "644"],
    ["README.md", "usr/share/doc/barge/README.md", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/barge", dest = "/usr/bin/barge", mode = "755" },
    { source = "assets/io.schnetter.Barge.desktop", dest = "/usr/share/applications/io.schnetter.Barge.desktop", mode = "644" },
    { source = "assets/io.schnetter.Barge.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.schnetter.Barge.svg", mode = "644" },
    { source = "assets/icons/hicolor/16x16/apps/io.schnetter.Barge.png", dest = "/usr/share/icons/hicolor/16x16/apps/io.schnetter.Barge.png", mode = "644" },
    { source = "assets/icons/hicolor/32x32/apps/io.schnetter.Barge.png", dest = "/usr/share/icons/hicolor/32x32/apps/io.schnetter.Barge.png", mode = "644" },
    { source = "assets/icons/hicolor/48x48/apps/io.schnetter.Barge.png", dest = "/usr/share/icons/hicolor/48x48/apps/io.schnetter.Barge.png", mode = "644" },
    { source = "assets/icons/hicolor/64x64/apps/io.schnetter.Barge.png", dest = "/usr/share/icons/hicolor/64x64/apps/io.schnetter.Barge.png", mode = "644" },
    { source = "assets/icons/hicolor/128x128/apps/io.schnetter.Barge.png", dest = "/usr/share/icons/hicolor/128x128/apps/io.schnetter.Barge.png", mode = "644" },
    { source = "assets/icons/hicolor/256x256/apps/io.schnetter.Barge.png", dest = "/usr/share/icons/hicolor/256x256/apps/io.schnetter.Barge.png", mode = "644" },
    { source = "assets/icons/hicolor/512x512/apps/io.schnetter.Barge.png", dest = "/usr/share/icons/hicolor/512x512/apps/io.schnetter.Barge.png", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/barge/README.md", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/barge/LICENSE", mode = "644" },
]

[package.metadata.generate-rpm.requires]
# Laufzeit-Bibliotheken für die egui/glow-GUI werden i. d. R. vom Desktop
# bereitgestellt; keine harten RPM-Abhängigkeiten erzwingen.
